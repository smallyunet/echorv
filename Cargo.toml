[package]
name = "echorv"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
description = "Bounded causal execution evidence for RISC-V firmware"
license = "MIT"
repository = "https://github.com/smallyunet/echorv"
readme = "README.md"
keywords = ["risc-v", "firmware", "debugging", "trace", "agents"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
strip = true
